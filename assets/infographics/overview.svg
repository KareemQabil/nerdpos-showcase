<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" rx="32" fill="#081120"/>
  <rect x="24" y="24" width="1232" height="672" rx="28" fill="#0C1730"/>
  <text x="72" y="90" fill="#E8F0FF" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700">NerdPOS Public Showcase Map</text>
  <text x="72" y="128" fill="#7ED7FF" font-family="Segoe UI, Arial, sans-serif" font-size="20">What the public evidence is showing without exposing private product internals.</text>

  <rect x="72" y="176" width="232" height="112" rx="18" fill="#13233B"/>
  <text x="102" y="224" fill="#E8F0FF" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Cashier Session</text>
  <text x="102" y="258" fill="#AEBEDB" font-family="Segoe UI, Arial, sans-serif" font-size="18">live order building and session handling</text>

  <rect x="372" y="176" width="232" height="112" rx="18" fill="#13233B"/>
  <text x="402" y="224" fill="#E8F0FF" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Payment Flow</text>
  <text x="402" y="258" fill="#AEBEDB" font-family="Segoe UI, Arial, sans-serif" font-size="18">amounts, confirmation, checkout logic</text>

  <rect x="672" y="176" width="232" height="112" rx="18" fill="#13233B"/>
  <text x="702" y="224" fill="#E8F0FF" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Receipt Output</text>
  <text x="702" y="258" fill="#AEBEDB" font-family="Segoe UI, Arial, sans-serif" font-size="18">receipt review, totals, QR or invoice surface</text>

  <rect x="972" y="176" width="236" height="112" rx="18" fill="#13233B"/>
  <text x="1002" y="224" fill="#E8F0FF" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Ops Follow-up</text>
  <text x="1002" y="258" fill="#AEBEDB" font-family="Segoe UI, Arial, sans-serif" font-size="18">inventory and compliance stay adjacent</text>

  <rect x="72" y="360" width="540" height="264" rx="22" fill="#101D35"/>
  <text x="104" y="408" fill="#7ED7FF" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">What this proves</text>
  <text x="104" y="452" fill="#E8F0FF" font-family="Segoe UI, Arial, sans-serif" font-size="24">• POS is treated as a real workflow, not a toy demo</text>
  <text x="104" y="492" fill="#E8F0FF" font-family="Segoe UI, Arial, sans-serif" font-size="24">• Payment and receipt output are part of the same system story</text>
  <text x="104" y="532" fill="#E8F0FF" font-family="Segoe UI, Arial, sans-serif" font-size="24">• Inventory and compliance are visible operational neighbors</text>
  <text x="104" y="572" fill="#E8F0FF" font-family="Segoe UI, Arial, sans-serif" font-size="24">• Arabic-first handling is central to the product direction</text>

  <rect x="652" y="360" width="556" height="264" rx="22" fill="#101D35"/>
  <text x="684" y="408" fill="#7ED7FF" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">What stays private</text>
  <text x="684" y="452" fill="#E8F0FF" font-family="Segoe UI, Arial, sans-serif" font-size="24">• backend implementation</text>
  <text x="684" y="492" fill="#E8F0FF" font-family="Segoe UI, Arial, sans-serif" font-size="24">• customer-specific workflows</text>
  <text x="684" y="532" fill="#E8F0FF" font-family="Segoe UI, Arial, sans-serif" font-size="24">• operational and financial data</text>
  <text x="684" y="572" fill="#E8F0FF" font-family="Segoe UI, Arial, sans-serif" font-size="24">• business rules that should not be published raw</text>
</svg>
