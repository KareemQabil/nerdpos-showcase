<svg width="1280" height="980" viewBox="0 0 1280 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="80" y1="40" x2="1200" y2="930" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1428"/>
      <stop offset="0.58" stop-color="#0F1D35"/>
      <stop offset="1" stop-color="#09111F"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#152742"/>
      <stop offset="1" stop-color="#0D1931"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#46E3FF"/>
      <stop offset="1" stop-color="#1AA7E0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="980" rx="30" fill="url(#bg)"/>
  <rect x="20" y="20" width="1240" height="940" rx="26" stroke="#243B60"/>

  <text x="62" y="88" fill="#EDF4FF" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700">NerdPOS Public Showcase</text>
  <text x="62" y="122" fill="#84DFFF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">A recruiter-facing map of the public proof, the operator workflow, and the boundary between what is shown and what stays private.</text>

  <g>
    <rect x="62" y="164" width="1156" height="286" rx="24" fill="#101C33" stroke="#20365B"/>
    <text x="94" y="202" fill="#6FD8FF" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="0.8">CORE OPERATOR FLOW</text>

    <rect x="94" y="230" width="474" height="84" rx="22" fill="#132843"/>
    <circle cx="126" cy="272" r="15" fill="url(#chip)"/>
    <text x="121" y="278" fill="#071221" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">1</text>
    <text x="154" y="268" fill="#EDF4FF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Session Gate</text>
    <text x="154" y="292" fill="#A5B7D5" font-family="Segoe UI, Arial, sans-serif" font-size="15">Open shift, validate operator readiness, and establish the working session</text>

    <path d="M568 272H624" stroke="#42E2FF" stroke-width="3" stroke-linecap="round"/>
    <path d="M614 264L630 272L614 280" stroke="#42E2FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="650" y="230" width="474" height="84" rx="22" fill="#132843"/>
    <circle cx="682" cy="272" r="15" fill="url(#chip)"/>
    <text x="677" y="278" fill="#071221" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">2</text>
    <text x="710" y="268" fill="#EDF4FF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Cart Build</text>
    <text x="710" y="292" fill="#A5B7D5" font-family="Segoe UI, Arial, sans-serif" font-size="15">Add products, adjust quantities, and keep totals and tax inside one selling surface</text>

    <path d="M362 314V356" stroke="#42E2FF" stroke-width="3" stroke-linecap="round"/>
    <path d="M354 346L362 362L370 346" stroke="#42E2FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M918 314V356" stroke="#42E2FF" stroke-width="3" stroke-linecap="round"/>
    <path d="M910 346L918 362L926 346" stroke="#42E2FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="94" y="364" width="474" height="84" rx="22" fill="#132843"/>
    <circle cx="126" cy="406" r="15" fill="url(#chip)"/>
    <text x="121" y="412" fill="#071221" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">3</text>
    <text x="154" y="402" fill="#EDF4FF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Payment</text>
    <text x="154" y="426" fill="#A5B7D5" font-family="Segoe UI, Arial, sans-serif" font-size="15">Choose method, match amount, and confirm the checkout without breaking flow</text>

    <path d="M568 406H624" stroke="#42E2FF" stroke-width="3" stroke-linecap="round"/>
    <path d="M614 398L630 406L614 414" stroke="#42E2FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="650" y="364" width="474" height="84" rx="22" fill="#132843"/>
    <circle cx="682" cy="406" r="15" fill="url(#chip)"/>
    <text x="677" y="412" fill="#071221" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">4</text>
    <text x="710" y="402" fill="#EDF4FF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Receipt and Follow-up</text>
    <text x="710" y="426" fill="#A5B7D5" font-family="Segoe UI, Arial, sans-serif" font-size="15">Generate receipt, preserve the reporting trail, and hand off into inventory and compliance</text>
  </g>

  <g>
    <rect x="62" y="484" width="556" height="430" rx="24" fill="url(#panel)" stroke="#20365B"/>
    <text x="94" y="524" fill="#6FD8FF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="0.8">PUBLIC EVIDENCE IN THIS REPO</text>

    <rect x="94" y="554" width="492" height="72" rx="18" fill="#101C33"/>
    <circle cx="124" cy="590" r="8" fill="#42E2FF"/>
    <text x="146" y="585" fill="#EDF4FF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Live checkout screenshots</text>
    <text x="146" y="608" fill="#A5B7D5" font-family="Segoe UI, Arial, sans-serif" font-size="15">Session gateway, cart state, payment handoff, and receipt review.</text>

    <rect x="94" y="642" width="492" height="72" rx="18" fill="#101C33"/>
    <circle cx="124" cy="678" r="8" fill="#42E2FF"/>
    <text x="146" y="673" fill="#EDF4FF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Operational module screenshots</text>
    <text x="146" y="696" fill="#A5B7D5" font-family="Segoe UI, Arial, sans-serif" font-size="15">Products, customers, inventory, and compliance surfaces in the same shell.</text>

    <rect x="94" y="730" width="492" height="72" rx="18" fill="#101C33"/>
    <circle cx="124" cy="766" r="8" fill="#42E2FF"/>
    <text x="146" y="761" fill="#EDF4FF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Workflow diagrams and case-study notes</text>
    <text x="146" y="784" fill="#A5B7D5" font-family="Segoe UI, Arial, sans-serif" font-size="15">Public explanation of how the checkout layer fits a wider POS system.</text>

    <rect x="94" y="818" width="492" height="72" rx="18" fill="#101C33"/>
    <circle cx="124" cy="854" r="8" fill="#42E2FF"/>
    <text x="146" y="849" fill="#EDF4FF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Product identity signals</text>
    <text x="146" y="872" fill="#A5B7D5" font-family="Segoe UI, Arial, sans-serif" font-size="15">Arabic-first UX, operator-centric navigation, and business workflow orientation.</text>
  </g>

  <g>
    <rect x="662" y="484" width="556" height="196" rx="24" fill="url(#panel)" stroke="#20365B"/>
    <text x="694" y="524" fill="#6FD8FF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="0.8">WHAT THIS SHOWCASE PROVES</text>

    <circle cx="700" cy="568" r="6" fill="#42E2FF"/>
    <text x="720" y="560" fill="#EDF4FF" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Real operator workflow</text>
    <text x="720" y="582" fill="#A5B7D5" font-family="Segoe UI, Arial, sans-serif" font-size="15">The POS surface behaves like working software, not a marketing shell.</text>

    <circle cx="700" cy="614" r="6" fill="#42E2FF"/>
    <text x="720" y="606" fill="#EDF4FF" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Transaction continuity</text>
    <text x="720" y="628" fill="#A5B7D5" font-family="Segoe UI, Arial, sans-serif" font-size="15">Payment and receipt output stay inside the same transaction story.</text>

    <circle cx="700" cy="660" r="6" fill="#42E2FF"/>
    <text x="720" y="652" fill="#EDF4FF" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Operational depth</text>
    <text x="720" y="674" fill="#A5B7D5" font-family="Segoe UI, Arial, sans-serif" font-size="15">Inventory and compliance are visible neighboring modules, not afterthoughts.</text>
  </g>

  <g>
    <rect x="662" y="714" width="556" height="200" rx="24" fill="#101C33" stroke="#20365B"/>
    <text x="694" y="754" fill="#F3C86F" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="0.8">WHAT STAYS PRIVATE</text>

    <circle cx="700" cy="798" r="6" fill="#F3C86F"/>
    <text x="720" y="790" fill="#EDF4FF" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Backend implementation</text>
    <text x="720" y="812" fill="#A5B7D5" font-family="Segoe UI, Arial, sans-serif" font-size="15">Integrations, business rules, and raw production logic are intentionally omitted.</text>

    <circle cx="700" cy="844" r="6" fill="#F3C86F"/>
    <text x="720" y="836" fill="#EDF4FF" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Customer-specific workflows</text>
    <text x="720" y="858" fill="#A5B7D5" font-family="Segoe UI, Arial, sans-serif" font-size="15">Operational data, financial records, and private implementation detail stay out.</text>
  </g>
</svg>
