<svg width="1280" height="900" viewBox="0 0 1280 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="80" y1="40" x2="1200" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1428"/>
      <stop offset="0.58" stop-color="#0F1C34"/>
      <stop offset="1" stop-color="#09111F"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#152743"/>
      <stop offset="1" stop-color="#0D1830"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#42E2FF"/>
      <stop offset="1" stop-color="#169EDF"/>
    </linearGradient>
    <linearGradient id="warn" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFD47F"/>
      <stop offset="1" stop-color="#F2B64A"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="900" rx="30" fill="url(#bg)"/>
  <rect x="20" y="20" width="1240" height="860" rx="26" stroke="#233A5E"/>

  <text x="62" y="88" fill="#EDF4FF" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700">NerdPOS Public Showcase</text>
  <text x="62" y="122" fill="#84DFFF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">A recruiter-facing map of the public proof, the operator workflow, and the boundary between what is shown and what stays private.</text>

  <g>
    <rect x="62" y="164" width="1156" height="198" rx="24" fill="#101C33" stroke="#20365B"/>
    <text x="94" y="200" fill="#6FD8FF" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="0.8">CORE OPERATOR FLOW</text>

    <rect x="94" y="228" width="224" height="96" rx="22" fill="#132843"/>
    <circle cx="126" cy="260" r="15" fill="url(#accent)"/>
    <text x="121" y="266" fill="#071221" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">1</text>
    <text x="154" y="260" fill="#EDF4FF" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Session Gate</text>
    <text x="154" y="286" fill="#A5B7D5" font-family="Segoe UI, Arial, sans-serif" font-size="15">open shift, operator readiness,</text>
    <text x="154" y="306" fill="#A5B7D5" font-family="Segoe UI, Arial, sans-serif" font-size="15">and working session control</text>

    <path d="M318 276H354" stroke="#42E2FF" stroke-width="3" stroke-linecap="round"/>
    <path d="M348 268L362 276L348 284" stroke="#42E2FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="366" y="228" width="224" height="96" rx="22" fill="#132843"/>
    <circle cx="398" cy="260" r="15" fill="url(#accent)"/>
    <text x="393" y="266" fill="#071221" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">2</text>
    <text x="426" y="260" fill="#EDF4FF" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Cart Build</text>
    <text x="426" y="286" fill="#A5B7D5" font-family="Segoe UI, Arial, sans-serif" font-size="15">products, quantities, totals,</text>
    <text x="426" y="306" fill="#A5B7D5" font-family="Segoe UI, Arial, sans-serif" font-size="15">and tax inside one surface</text>

    <path d="M590 276H626" stroke="#42E2FF" stroke-width="3" stroke-linecap="round"/>
    <path d="M620 268L634 276L620 284" stroke="#42E2FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="638" y="228" width="224" height="96" rx="22" fill="#132843"/>
    <circle cx="670" cy="260" r="15" fill="url(#accent)"/>
    <text x="665" y="266" fill="#071221" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">3</text>
    <text x="698" y="260" fill="#EDF4FF" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Payment</text>
    <text x="698" y="286" fill="#A5B7D5" font-family="Segoe UI, Arial, sans-serif" font-size="15">cash selection, matching amount,</text>
    <text x="698" y="306" fill="#A5B7D5" font-family="Segoe UI, Arial, sans-serif" font-size="15">and confirmation flow</text>

    <path d="M862 276H898" stroke="#42E2FF" stroke-width="3" stroke-linecap="round"/>
    <path d="M892 268L906 276L892 284" stroke="#42E2FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="910" y="228" width="276" height="96" rx="22" fill="#132843"/>
    <circle cx="942" cy="260" r="15" fill="url(#accent)"/>
    <text x="937" y="266" fill="#071221" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">4</text>
    <text x="970" y="260" fill="#EDF4FF" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Receipt and Follow-up</text>
    <text x="970" y="286" fill="#A5B7D5" font-family="Segoe UI, Arial, sans-serif" font-size="15">receipt output, reporting trail, and the</text>
    <text x="970" y="306" fill="#A5B7D5" font-family="Segoe UI, Arial, sans-serif" font-size="15">handoff into inventory and compliance</text>
  </g>

  <g>
    <rect x="62" y="396" width="556" height="460" rx="24" fill="url(#panel)" stroke="#20365B"/>
    <text x="94" y="436" fill="#6FD8FF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="0.8">PUBLIC EVIDENCE IN THIS REPO</text>

    <rect x="94" y="466" width="492" height="78" rx="18" fill="#101C33"/>
    <circle cx="124" cy="505" r="8" fill="url(#accent)"/>
    <text x="146" y="500" fill="#EDF4FF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Live checkout screenshots</text>
    <text x="146" y="523" fill="#A5B7D5" font-family="Segoe UI, Arial, sans-serif" font-size="15">Session gateway, cart state, payment handoff, and receipt review.</text>

    <rect x="94" y="560" width="492" height="78" rx="18" fill="#101C33"/>
    <circle cx="124" cy="599" r="8" fill="url(#accent)"/>
    <text x="146" y="594" fill="#EDF4FF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Operational module screenshots</text>
    <text x="146" y="617" fill="#A5B7D5" font-family="Segoe UI, Arial, sans-serif" font-size="15">Products, customers, inventory, and compliance surfaces in the same shell.</text>

    <rect x="94" y="654" width="492" height="78" rx="18" fill="#101C33"/>
    <circle cx="124" cy="693" r="8" fill="url(#accent)"/>
    <text x="146" y="688" fill="#EDF4FF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Workflow diagrams and case-study notes</text>
    <text x="146" y="711" fill="#A5B7D5" font-family="Segoe UI, Arial, sans-serif" font-size="15">Public explanation of how the checkout layer fits a wider POS system.</text>

    <rect x="94" y="748" width="492" height="78" rx="18" fill="#101C33"/>
    <circle cx="124" cy="787" r="8" fill="url(#accent)"/>
    <text x="146" y="782" fill="#EDF4FF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Product identity signals</text>
    <text x="146" y="805" fill="#A5B7D5" font-family="Segoe UI, Arial, sans-serif" font-size="15">Arabic-first UX, operator-centric navigation, and business workflow orientation.</text>
  </g>

  <g>
    <rect x="662" y="396" width="556" height="212" rx="24" fill="url(#panel)" stroke="#20365B"/>
    <text x="694" y="436" fill="#6FD8FF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="0.8">WHAT THIS SHOWCASE PROVES</text>

    <circle cx="700" cy="482" r="6" fill="#42E2FF"/>
    <text x="720" y="474" fill="#EDF4FF" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Real operator workflow</text>
    <text x="720" y="496" fill="#A5B7D5" font-family="Segoe UI, Arial, sans-serif" font-size="15">The POS surface behaves like working software, not a marketing shell.</text>

    <circle cx="700" cy="534" r="6" fill="#42E2FF"/>
    <text x="720" y="526" fill="#EDF4FF" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Transaction continuity</text>
    <text x="720" y="548" fill="#A5B7D5" font-family="Segoe UI, Arial, sans-serif" font-size="15">Payment and receipt output stay inside the same transaction story.</text>

    <circle cx="700" cy="586" r="6" fill="#42E2FF"/>
    <text x="720" y="578" fill="#EDF4FF" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Operational depth</text>
    <text x="720" y="600" fill="#A5B7D5" font-family="Segoe UI, Arial, sans-serif" font-size="15">Inventory and compliance are visible neighboring modules, not afterthoughts.</text>
  </g>

  <g>
    <rect x="662" y="644" width="556" height="212" rx="24" fill="#101C33" stroke="#20365B"/>
    <text x="694" y="684" fill="url(#warn)" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="0.8">WHAT STAYS PRIVATE</text>

    <circle cx="700" cy="730" r="6" fill="#F3C86F"/>
    <text x="720" y="722" fill="#EDF4FF" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Backend implementation</text>
    <text x="720" y="744" fill="#A5B7D5" font-family="Segoe UI, Arial, sans-serif" font-size="15">Integrations, business rules, and raw production logic are intentionally omitted.</text>

    <circle cx="700" cy="782" r="6" fill="#F3C86F"/>
    <text x="720" y="774" fill="#EDF4FF" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Customer-specific workflows</text>
    <text x="720" y="796" fill="#A5B7D5" font-family="Segoe UI, Arial, sans-serif" font-size="15">Operational data, financial records, and private implementation detail stay out.</text>
  </g>
</svg>
