<svg width="1280" height="820" viewBox="0 0 1280 820" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="88" y1="32" x2="1180" y2="780" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1428"/>
      <stop offset="0.55" stop-color="#0E1C34"/>
      <stop offset="1" stop-color="#08111F"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#13243F"/>
      <stop offset="1" stop-color="#0C1830"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#42E2FF"/>
      <stop offset="1" stop-color="#1EA8E4"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="820" rx="30" fill="url(#bg)"/>
  <rect x="20" y="20" width="1240" height="780" rx="26" stroke="#243B60"/>

  <text x="62" y="84" fill="#ECF4FF" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700">NerdPOS Public Showcase</text>
  <text x="62" y="118" fill="#84DFFF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">A recruiter-facing map of what the public case study proves and what it intentionally does not publish.</text>

  <g>
    <rect x="62" y="162" width="1156" height="120" rx="24" fill="#101C33" stroke="#20365B"/>
    <text x="96" y="196" fill="#6FD8FF" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="0.8">CORE OPERATOR FLOW</text>

    <rect x="96" y="214" width="208" height="42" rx="21" fill="#132843"/>
    <text x="136" y="240" fill="#EAF2FF" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Session gate</text>
    <text x="198" y="240" fill="#7A8FAA" font-family="Segoe UI, Arial, sans-serif" font-size="16">open shift</text>

    <path d="M304 235H352" stroke="#3EDCFF" stroke-width="3" stroke-linecap="round"/>
    <path d="M348 228L360 235L348 242" stroke="#3EDCFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="360" y="214" width="220" height="42" rx="21" fill="#132843"/>
    <text x="400" y="240" fill="#EAF2FF" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Cart build</text>
    <text x="472" y="240" fill="#7A8FAA" font-family="Segoe UI, Arial, sans-serif" font-size="16">products, totals, tax</text>

    <path d="M580 235H628" stroke="#3EDCFF" stroke-width="3" stroke-linecap="round"/>
    <path d="M624 228L636 235L624 242" stroke="#3EDCFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="636" y="214" width="220" height="42" rx="21" fill="#132843"/>
    <text x="676" y="240" fill="#EAF2FF" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Payment collection</text>
    <text x="818" y="240" fill="#7A8FAA" font-family="Segoe UI, Arial, sans-serif" font-size="16">cash, confirmation</text>

    <path d="M856 235H904" stroke="#3EDCFF" stroke-width="3" stroke-linecap="round"/>
    <path d="M900 228L912 235L900 242" stroke="#3EDCFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="912" y="214" width="272" height="42" rx="21" fill="#132843"/>
    <text x="952" y="240" fill="#EAF2FF" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Receipt, reporting, follow-up</text>
    <text x="1164" y="240" fill="#7A8FAA" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="end">inventory and compliance stay adjacent</text>
  </g>

  <g>
    <rect x="62" y="324" width="556" height="436" rx="24" fill="url(#card)" stroke="#20365B"/>
    <text x="96" y="366" fill="#6FD8FF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="0.8">PUBLIC EVIDENCE IN THIS REPO</text>

    <rect x="96" y="396" width="488" height="70" rx="18" fill="#101C33"/>
    <circle cx="126" cy="431" r="8" fill="url(#accent)"/>
    <text x="148" y="424" fill="#EAF2FF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Live checkout screenshots</text>
    <text x="148" y="448" fill="#A5B7D5" font-family="Segoe UI, Arial, sans-serif" font-size="15">Session gateway, cart state, payment handoff, receipt review.</text>

    <rect x="96" y="480" width="488" height="70" rx="18" fill="#101C33"/>
    <circle cx="126" cy="515" r="8" fill="url(#accent)"/>
    <text x="148" y="508" fill="#EAF2FF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Operational module screenshots</text>
    <text x="148" y="532" fill="#A5B7D5" font-family="Segoe UI, Arial, sans-serif" font-size="15">Products, customers, orders, inventory, and compliance shells.</text>

    <rect x="96" y="564" width="488" height="70" rx="18" fill="#101C33"/>
    <circle cx="126" cy="599" r="8" fill="url(#accent)"/>
    <text x="148" y="592" fill="#EAF2FF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Workflow diagrams and case-study notes</text>
    <text x="148" y="616" fill="#A5B7D5" font-family="Segoe UI, Arial, sans-serif" font-size="15">Public explanation of how the checkout layer fits a wider POS system.</text>

    <rect x="96" y="648" width="488" height="82" rx="18" fill="#101C33"/>
    <circle cx="126" cy="684" r="8" fill="url(#accent)"/>
    <text x="148" y="677" fill="#EAF2FF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Product identity signals</text>
    <text x="148" y="701" fill="#A5B7D5" font-family="Segoe UI, Arial, sans-serif" font-size="15">Arabic-first UI, operator-centric navigation, and business workflow orientation.</text>
  </g>

  <g>
    <rect x="662" y="324" width="556" height="206" rx="24" fill="url(#card)" stroke="#20365B"/>
    <text x="696" y="366" fill="#6FD8FF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="0.8">WHAT THIS SHOWCASE PROVES</text>
    <circle cx="700" cy="406" r="6" fill="#42E2FF"/>
    <text x="720" y="412" fill="#EAF2FF" font-family="Segoe UI, Arial, sans-serif" font-size="18">The POS surface is treated as a real operator workflow, not a marketing shell.</text>
    <circle cx="700" cy="444" r="6" fill="#42E2FF"/>
    <text x="720" y="450" fill="#EAF2FF" font-family="Segoe UI, Arial, sans-serif" font-size="18">Payment and receipt output sit inside the same working transaction story.</text>
    <circle cx="700" cy="482" r="6" fill="#42E2FF"/>
    <text x="720" y="488" fill="#EAF2FF" font-family="Segoe UI, Arial, sans-serif" font-size="18">Inventory and compliance are visible neighboring modules, not afterthoughts.</text>
  </g>

  <g>
    <rect x="662" y="554" width="556" height="206" rx="24" fill="#101C33" stroke="#20365B"/>
    <text x="696" y="596" fill="#FFCC7A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="0.8">WHAT STAYS PRIVATE</text>
    <circle cx="700" cy="636" r="6" fill="#FFCC7A"/>
    <text x="720" y="642" fill="#EAF2FF" font-family="Segoe UI, Arial, sans-serif" font-size="18">Backend implementation, integrations, and business rules.</text>
    <circle cx="700" cy="674" r="6" fill="#FFCC7A"/>
    <text x="720" y="680" fill="#EAF2FF" font-family="Segoe UI, Arial, sans-serif" font-size="18">Customer-specific workflows, operational data, and financial records.</text>
    <circle cx="700" cy="712" r="6" fill="#FFCC7A"/>
    <text x="720" y="718" fill="#EAF2FF" font-family="Segoe UI, Arial, sans-serif" font-size="18">Any raw production logic that should not be published as portfolio code.</text>
  </g>
</svg>
